#  Template NodeJS build

#  This template allows you to validate your NodeJS code.
#  The workflow allows running tests and code linting on the default branch.

image: node:20

pipelines:
  default:
    - parallel:
        - step:
            name: Check formatting
            script:
              - npm install
              - npm run format-check
            caches:
              - node
        - step:
            name: Code linting
            script:
              - npm install
              - npm run lint
            caches:
              - node
        - step:
            name: Type checking
            script:
              - npm install
              - npm run type-check
            caches:
              - node
        - step:
            name: Translation keys check
            script:
              - npm install
              - npm run check:i18n
            caches:
              - node
        - step:
            name: Unit tests
            script:
              - npm install
              - npm run test:unit -- --run
            caches:
              - node
