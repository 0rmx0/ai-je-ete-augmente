name: Update inflation data

on:
  schedule:
    - cron: '0 4 20 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-inflation-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Import latest inflation data
        run: npm run import
      - name: Format generated JSON
        run: npx prettier --write src/assets/inflations/
      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/inflations/
          if git diff --cached --quiet; then
            echo "No new inflation data, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: update inflation data"
      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: git push
